<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TMT KPI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
      background: #f0f4f1; color: #222;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .box {
      background: #fff; max-width: 480px; width: 100%;
      border-radius: 14px; padding: 32px 28px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 26px; color: #1a5c3a; }
    p { margin: 0 0 14px; font-size: 14px; color: #555; line-height: 1.55; }
    .btn {
      display: block; width: 100%;
      background: #1a5c3a; color: #fff; text-decoration: none;
      font-weight: 700; font-size: 16px;
      padding: 14px 18px; border-radius: 10px; margin: 10px 0;
    }
    .btn2 {
      display: block; width: 100%;
      background: #fff; color: #1a5c3a; text-decoration: none;
      font-weight: 700; font-size: 14px;
      padding: 12px 18px; border-radius: 10px; margin: 10px 0;
      border: 2px solid #1a5c3a;
    }
    .hint {
      margin-top: 18px; padding: 12px 14px;
      background: #fff8e6; border-radius: 8px;
      font-size: 13px; color: #664d03; text-align: left; line-height: 1.5;
    }
    code {
      display: block; margin-top: 8px; padding: 8px;
      background: #f5f5f5; border-radius: 6px;
      font-size: 10px; word-break: break-all; color: #333;
    }
    .ver { margin-top: 12px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <h1>TMT KPI</h1>
    <p>Ứng dụng đánh giá KPI cán bộ.<br>Bấm nút bên dưới để vào.</p>

    <a class="btn" id="goApp" href="#">Vào TMT KPI</a>
    <a class="btn2" id="goFix" href="#">Không vào được? Đăng xuất Google rồi vào lại</a>

    <div class="hint">
      <b>Nếu báo “không thể mở tệp”:</b> máy đang mở nhiều Gmail — bấm nút thứ hai, hoặc cửa sổ ẩn danh / điện thoại chỉ 1 email.
      <code id="showUrl"></code>
    </div>
    <div class="ver">landing v20260920c</div>
  </div>
  <script>
    // Deployment ID ghép từ đoạn cố định — tránh nhầm chữ I (hoa) với l (thường) khi sửa HTML.
    var DEPLOY_ID = [
      "AKfycbxceBcr",
      "I",
      "aG6CUxP8zScjqDhrff95Q63DA5QF",
      "l",
      "6c6_TtWG",
      "l",
      "iadsBoL4RFvn1qw_NGyhFzA"
    ].join("");
    var APP = "https://script.google.com/macros/s/" + DEPLOY_ID + "/exec";
    document.getElementById("goApp").href = APP;
    document.getElementById("goFix").href =
      "https://accounts.google.com/Logout?continue=" + encodeURIComponent(APP);
    document.getElementById("showUrl").textContent = APP;
  </script>
</body>
</html>
